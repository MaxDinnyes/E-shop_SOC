<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons8-logo-50.svg">
    <title>E-shop | Kontakt</title>
</head>
<body>
    <nav>
        <ul class="navList"> 
            <li>
                <img class="navLogo" src="icons8-logo-50.svg" alt="Logo">
                <div class="hamburger">
                    <div id="lineTop" class="line"></div>
                    <div id="lineMid" class="line"></div>
                    <div id="lineBot" class="line"></div>
                </div>
            </li>
            <li><img class="navLogoMobile" src="icons8-logo-50.svg" alt="Logo"></li>
            <div class="produktNav">
                <li><a href="index.html">Domov</a></li>
                <li><a href="produkty.html">Produkty</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </div>
            <li id="cartOpen"><img class="navCartSvg" src="shopping-cart.svg" alt="Logo"><span id="cartCount" class="cart-count">0</span></li>
        </ul>
    </nav>

    <div class="navPhone">
        <ul class="navListPhone">
            <li><a href="index.html">Domov</a></li>
            <li><a href="produkty.html">Produkty</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
    </div>
<div class="formCenter">
    <form method="get" class="kontaktForm">
        <div class="meno">
            <div class="menoKrstne">
                <label for="krstne">Meno</label>
                <input type="text" placeholder="Ján">
            </div>
            <div class="menoPriezvisko">
                <label for="priezvisko">Priezvisko</label>
                <input type="text" placeholder="Mrkvička">
            </div>
        </div>
        <br>
        <label for="mail">E-mail</label>
        <input type="email" placeholder="jan.mrkvicka@gmail.com">
        <br>
        <label for="telefon">Telefóne číslo</label>
        <input type="tel" placeholder="+421 915 164 087">
        <br>
        <label for="sprava">Správa</label>
        <textarea name="spravaKontakt" id="spravaKontakt" placeholder="..."></textarea>
        <br>
        <input type="submit" id="submitKontakt">
    </form>
</div>

    <footer>
        <p class="copyright">© 2026. Všetky práva vyhradené.</p>
    </footer>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <h4>Váš košík</h4>
            <ul id="cartItems" class="cart-items"></ul>
            <p class="font-semibold">Spolu: <span id="cartTotal">0 €</span></p>
            <div class="cart-footer">
                <button id="cartClose" class="closeBtn">Zavrieť</button>
                <button class="objednajBtn">Objednať</button>
            </div>
        </div>
    </div>
    
    <script src="script_kontakt.js"></script>
    <script src="produkty_kosik.js"></script>
</body>

</html>
